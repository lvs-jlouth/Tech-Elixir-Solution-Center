name: Dependabot Alert Triage

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  create-triage-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create triage issue from new vulnerability alert
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            if (!alert) {
              core.warning("No alert payload found.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pkg = alert.dependency?.package?.name || "unknown-package";
            const ecosystem = alert.dependency?.package?.ecosystem || "unknown-ecosystem";
            const severity = alert.security_advisory?.severity || "unknown";
            const summary = alert.security_advisory?.summary || "No summary provided.";
            const cve = alert.security_advisory?.cve_id || "n/a";
            const ghsa = alert.security_advisory?.ghsa_id || "n/a";
            const vulnerable = (alert.security_vulnerability?.vulnerable_version_range) || "n/a";
            const firstPatched = (alert.security_vulnerability?.first_patched_version?.identifier) || "n/a";
            const htmlUrl = alert.html_url || "";

            const title = `[Dependabot Alert] ${pkg} (${severity})`;
            const body = [
              "## Vulnerability Alert",
              "",
              `Package: ${pkg}`,
              `Ecosystem: ${ecosystem}`,
              `Severity: ${severity}`,
              `CVE: ${cve}`,
              `GHSA: ${ghsa}`,
              "",
              `Vulnerable Range: ${vulnerable}`,
              `First Patched Version: ${firstPatched}`,
              "",
              `Summary: ${summary}`,
              "",
              htmlUrl ? `Alert URL: ${htmlUrl}` : "Alert URL: n/a",
              "",
              "## Triage Checklist",
              "- [ ] Confirm impacted runtime/package path",
              "- [ ] Validate fix availability and compatibility",
              "- [ ] Merge or create remediation PR",
              "- [ ] Document risk/exception if fix cannot be applied immediately"
            ].join("\n");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["security", "dependencies", "dependabot-alert"]
            });
